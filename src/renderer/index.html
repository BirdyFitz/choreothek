<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choreothek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .nav-tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            background: #f8f9fa;
        }

        .nav-tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            background: white;
        }

        .nav-tab:hover {
            background: white;
            color: #667eea;
        }

        .content {
            padding: 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input[type="file"],
        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        input[type="file"]:hover,
        input[type="text"]:hover,
        input[type="date"]:hover,
        select:hover,
        textarea:hover {
            border-color: #667eea;
        }

        input[type="file"]:focus,
        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Zweitrangige Knöpfe (Durchsuchen, Entfernen, Abbrechen) */
        button.secondary {
            background: #f3f3f8;
            color: #444;
            border: 2px solid #e2e2ee;
            padding: 10px 16px;
            font-weight: 500;
        }

        button.secondary:hover {
            box-shadow: none;
            border-color: #667eea;
        }

        /* Pfadfeld mit Knöpfen daneben */
        .path-field {
            display: flex;
            gap: 8px;
        }

        .path-field input {
            flex: 1;
            min-width: 0;
        }

        .path-field button {
            white-space: nowrap;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid #eee;
            color: #666;
            font-size: 0.9em;
        }

        .results-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
        }

        .results-table tbody tr.song-row:nth-child(4n+1) {
            background: #f8f9fa;
        }

        .song-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .media-link {
            margin-left: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .media-link:hover {
            opacity: 0.7;
        }

        .song-row:hover {
            background: #eef0fc !important;
        }

        .song-row.expanded {
            background: #e4e8fb !important;
        }

        .detail-row td {
            padding: 0;
            border-bottom: 1px solid #eee;
        }

        .choreo-frame {
            width: 100%;
            height: 70vh;
            border: none;
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 10px;
        }

        /* Videos, die keinem Song zugeordnet werden konnten */
        .unassigned-cell {
            color: #777;
            font-style: italic;
        }

        .unassigned-tag {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 7px;
            border-radius: 10px;
            background: #f0f0f0;
            color: #888;
            font-size: 0.75em;
            font-style: normal;
        }

        /* Trennlinie zwischen den Blöcken Song/Rhythmus, Jam Session, MegaMix/ZIN Volume */
        .search-divider {
            border: none;
            border-top: 2px solid #eee;
            margin: 0 0 25px;
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }

            .results-table {
                font-size: 0.85em;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .nav-tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
</body>
</html>
